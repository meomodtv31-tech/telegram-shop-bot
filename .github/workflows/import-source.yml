name: Import full bot source with VietQR ACB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: sync/full-source-vietqr-acb
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 --branch feature/vietqr-bot-acb https://github.com/meomodtv31-tech/Telegram-Bot-Shop-Acc.git /tmp/source

      - name: Copy application source
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/source/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import full bot source with VietQR ACB"
            git push origin HEAD:sync/full-source-vietqr-acb
          else
            echo "No changes to import"
          fi
